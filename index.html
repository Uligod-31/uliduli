  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; height: 100%; background: #0b0c10; overflow: hidden; overscroll-behavior: none; touch-action: none; }
    #game { position: fixed; inset: 0; z-index: 1; }
    #game canvas { background: transparent !important; }
    #splash { position: fixed; inset: 0; display: grid; place-items: center; background: radial-gradient(ellipse at 50% 55%, #1b1f27 0%, #0b0c10 70%); color: #eceef3;
      font: 600 13px system-ui, sans-serif; letter-spacing: .5em; transition: opacity .5s; z-index: 5; overflow: hidden; }
    #splash::after { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .5;
      background: repeating-linear-gradient(0deg, rgba(0,0,0,.5) 0 1px, transparent 1px 4px); }
    #splash .box { text-align: center; position: relative; }
    #splash svg { width: 96px; height: 130px; overflow: visible; filter: drop-shadow(0 0 22px rgba(255,140,40,.65)); }
    #splash .fl { transform-origin: 50% 100%; animation: flick .9s infinite ease-in-out; }
    #splash .fl2 { transform-origin: 50% 100%; animation: flick .7s infinite ease-in-out reverse; }
    @keyframes flick { 0%,100% { transform: scaleY(1) skewX(0); } 25% { transform: scaleY(1.07) skewX(-4deg); } 50% { transform: scaleY(.95) skewX(3deg); } 75% { transform: scaleY(1.04) skewX(-2deg); } }
    #splash svg.logo { display: block; width: 210px; height: auto; margin: 10px auto 18px; fill: #eef2ff; animation: gl 3.2s infinite steps(1); filter: drop-shadow(-2px 0 #27d3ff) drop-shadow(2px 0 #ff2bd6); }
    @keyframes gl { 0%,88%,100% { transform: none; } 90% { transform: translateX(4px); } 94% { transform: translateX(-5px); } }
    #splash .bar { width: 160px; height: 3px; margin: 16px auto 0; background: #2a2c33; overflow: hidden; }
    #splash .bar i { display: block; width: 40%; height: 100%; background: linear-gradient(90deg,#3b74f2,#8a4bea,#e02bc0); animation: ld 1.1s infinite linear; }
    @keyframes ld { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
    #splash.hide { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="splash"><div class="box">
    <svg viewBox="0 0 100 135" aria-hidden="true">
      <defs><linearGradient id="sf" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ff6a14"/><stop offset=".6" stop-color="#ffa63a"/><stop offset="1" stop-color="#ffe2a0"/></linearGradient></defs>
      <path class="fl" d="M52 4C58 30 84 48 84 82C84 110 68 126 50 126C32 126 16 110 16 82C16 56 34 42 42 22C45 36 48 34 52 4Z" fill="url(#sf)"/>

      <ellipse cx="39" cy="92" rx="5" ry="9" fill="#1a0c05"/><ellipse cx="62" cy="92" rx="5" ry="9" fill="#1a0c05"/>
    </svg>
    <svg class="logo" viewBox="-8 -42 524 152" role="img" aria-label="ÜLidÜLi"><path fill-rule="evenodd" d="M0 0L30 0L30 60Q30 73 42 73Q54 73 54 60L54 0L84 0L84 60Q84 100 42 100Q0 100 0 60ZM3 -34L31 -34L31 -11L3 -11ZM53 -34L81 -34L81 -11L53 -11ZM97 0L127 0L127 73L159 73L159 100L97 100ZM172 28L202 28L202 100L172 100ZM172 -2L202 -2L202 19L172 19ZM263 -2L293 -2L293 100L263 100L263 94Q255 101 243 101Q215 101 215 64Q215 27 243 27Q255 27 263 34ZM263 56Q259 50 253 50Q244 50 244 64Q244 78 253 78Q259 78 263 72ZM306 0L336 0L336 60Q336 73 348 73Q360 73 360 60L360 0L390 0L390 60Q390 100 348 100Q306 100 306 60ZM309 -34L337 -34L337 -11L309 -11ZM359 -34L387 -34L387 -11L359 -11ZM403 0L433 0L433 73L465 73L465 100L403 100ZM478 28L508 28L508 100L478 100ZM478 -2L508 -2L508 19L478 19Z"/></svg>A ACENDER A CHAMA
    <div class="bar"><i></i></div>
  </div></div>
  <script type="module" src="/src/main.ts"></script>
